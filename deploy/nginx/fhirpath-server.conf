# Reverse proxy for fhirpath-server (host nginx model).
#
# This file exposes the server by IP address with a CA-issued Let's Encrypt IP
# certificate. Let's Encrypt IP certificates are short-lived (6 days), so
# automated renewal is required — see the README "Automate renewal" step.
#
# BEFORE USE:
#   1. Replace __SERVER_IP__ below with the server's public IP (the README does
#      this for you with sed).
#   2. On a fresh host the Let's Encrypt cert doesn't exist yet, so nginx can't
#      start against the ssl_certificate paths below. The README bootstraps with
#      a temporary self-signed cert, obtains the real cert via certbot's webroot
#      plugin, then switches these paths back. Follow it in order.
#   3. Moving to a subdomain later is a small edit — see the README
#      "Later: moving to a subdomain" step.
#
# SECURITY: TLS terminates here, so the app's container port must NOT be
# independently reachable. Publish the container on loopback only — run it
# with `-p 127.0.0.1:8080:8080` (see the README "Deploy to the host" step).
# Otherwise clients can bypass nginx (and its TLS) by hitting
# http://SERVER_IP:8080 directly.

# Redirect plain HTTP to HTTPS, but serve ACME HTTP-01 challenges over HTTP so
# certbot's webroot plugin can renew the certificate without downtime.
server {
    listen      80;
    listen      [::]:80;
    server_name __SERVER_IP__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name __SERVER_IP__;

    # CA-issued Let's Encrypt certificate for the IP (steady state). On first
    # setup these paths don't exist yet — see the README, which points nginx at
    # a temporary self-signed cert until certbot has issued, then switches back.
    ssl_certificate     /etc/letsencrypt/live/__SERVER_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SERVER_IP__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # FHIR resources in POST bodies can exceed nginx's 1m default.
    client_max_body_size 10m;

    access_log /var/log/nginx/fhirpath-server.access.log;
    error_log  /var/log/nginx/fhirpath-server.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
